<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Restaurant Management</h2>
    <button mat-raised-button color="primary" routerLink="/restaurants/add">
      <mat-icon>add</mat-icon> Add New Restaurant
    </button>
  </div>

  <mat-card>
    <table mat-table [dataSource]="restaurants" class="w-100">
      
      <ng-container matColumnDef="restaurantId">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.restaurantId}} </td>
      </ng-container>

      <ng-container matColumnDef="restaurantName">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.restaurantName}} </td>
      </ng-container>

      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef> Location </th>
        <td mat-cell *matCellDef="let element"> {{element.location}} </td>
      </ng-container>

      <ng-container matColumnDef="isOpen">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element"> 
          <span class="badge" [ngClass]="element.isOpen ? 'bg-success' : 'bg-danger'">
            {{element.isOpen ? 'Open' : 'Closed'}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="editRestaurant(element.restaurantId)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteRestaurant(element.restaurantId)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</div>
