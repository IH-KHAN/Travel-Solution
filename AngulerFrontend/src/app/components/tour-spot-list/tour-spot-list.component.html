<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-0">Tour Spots</h2>
      <p class="text-muted small mb-0">Manage tourist destinations grouped by locations</p>
    </div>
    <button mat-raised-button color="primary" routerLink="/tourspots/new" id="add-tourspot-btn">
      <mat-icon>add</mat-icon> Add Tour Spots
    </button>
  </div>

  <mat-card class="shadow-sm">
    <table mat-table [dataSource]="locations" class="w-100">

      <!-- ID Column -->
      <ng-container matColumnDef="locationId">
        <th mat-header-cell *matHeaderCellDef style="width:80px">ID</th>
        <td mat-cell *matCellDef="let row">{{ row.locationId }}</td>
      </ng-container>

      <!-- Location Name Column -->
      <ng-container matColumnDef="locationName">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let row">
          <span class="fw-semibold">{{ row.locationName }}</span>
        </td>
      </ng-container>

      <!-- Tour Spots Column -->
      <ng-container matColumnDef="tourSpots">
        <th mat-header-cell *matHeaderCellDef>Tour Spots</th>
        <td mat-cell *matCellDef="let row">
          <div class="d-flex flex-wrap gap-1 py-2">
            <span *ngFor="let spot of row.tourSpots" class="badge bg-success-subtle text-success-emphasis rounded-pill px-2 py-1">
              {{ spot.spotName }}
            </span>
            <span *ngIf="!row.tourSpots || row.tourSpots.length === 0" class="text-muted small">
              No tour spots
            </span>
          </div>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
        <td mat-cell *matCellDef="let row" class="text-end">
          <button mat-icon-button color="primary" (click)="editLocationSpots(row.locationId)"
                  matTooltip="Edit Tour Spots">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteLocationSpots(row.locationId)"
                  matTooltip="Delete All Tour Spots in Location">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row-hover"></tr>
    </table>

    <div *ngIf="locations.length === 0" class="p-5 text-center text-muted">
      <mat-icon style="font-size:48px;width:48px;height:48px;opacity:0.3">travel_explore</mat-icon>
      <p class="mt-2">No tour spots found. Click "Add Tour Spots" to get started.</p>
    </div>
  </mat-card>
</div>
