<div class="container mt-4 mb-5" style="max-width: 800px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">{{ isEditMode ? 'Edit Division' : 'Add New Division' }}</h2>
    <button mat-button color="warn" (click)="cancel()">
      <mat-icon>arrow_back</mat-icon> Back to List
    </button>
  </div>

  <mat-card class="shadow-sm">
    <mat-card-content class="pt-4">
      <form [formGroup]="geographyForm" (ngSubmit)="onSubmit()">
        
        <h4 class="text-primary mb-3"><mat-icon class="align-middle">map</mat-icon> Division Details</h4>
        <div class="row">
          <div class="col-md-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Division Name</mat-label>
              <input matInput formControlName="divisionName" placeholder="Enter division name">
              <mat-error *ngIf="geographyForm.get('divisionName')?.hasError('required')">Division name is required</mat-error>
            </mat-form-field>
          </div>
        </div>

        <mat-divider class="my-4"></mat-divider>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="text-primary mb-0"><mat-icon class="align-middle">location_city</mat-icon> Districts</h4>
          <button type="button" mat-stroked-button color="primary" (click)="addDistrict()">
            <mat-icon>add</mat-icon> Add District
          </button>
        </div>

        <div formArrayName="districts">
          <div *ngFor="let district of districts.controls; let i=index" [formGroupName]="i" class="row align-items-center mb-2 p-3 bg-light rounded mx-0">
            <div class="col-md-10">
              <mat-form-field appearance="outline" class="w-100 mb-0">
                <mat-label>District Name</mat-label>
                <input matInput formControlName="districtName" placeholder="Enter district name">
                <mat-error *ngIf="district.get('districtName')?.hasError('required')">District name is required</mat-error>
              </mat-form-field>
            </div>
            <div class="col-md-2 text-end">
              <button type="button" mat-icon-button color="warn" (click)="removeDistrict(i)" title="Remove District">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </div>
        </div>
        
        <div *ngIf="districts.length === 0" class="text-muted fst-italic mb-3">
          No districts added yet.
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
          <button type="button" mat-stroked-button (click)="cancel()">Cancel</button>
          <button type="submit" mat-raised-button color="primary" [disabled]="geographyForm.invalid">
            <mat-icon>save</mat-icon> {{ isEditMode ? 'Update' : 'Save' }}
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
