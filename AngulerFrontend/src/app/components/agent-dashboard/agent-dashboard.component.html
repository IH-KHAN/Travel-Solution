<div class="container py-4">
  <h1 class="fs-2 fw-bold mb-4 text-dark">My Assigned Packages</h1>
  
  <div class="row g-4">
    <div *ngFor="let pkg of packages" class="col-12 col-md-6 col-lg-4">
      <div class="card h-100 shadow-sm border-0 transition-shadow">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h2 class="card-title fs-5 fw-bold text-dark mb-0">{{ pkg.packageTitle }}</h2>
            <span class="badge bg-primary text-white rounded-pill ms-2">
              {{ pkg.packageCode }}
            </span>
          </div>
          
          <p class="card-text text-secondary mb-3" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
            {{ pkg.description }}
          </p>
          
          <div class="d-flex justify-content-between align-items-center small text-muted mb-4">
            <div class="d-flex align-items-center">
              <svg class="me-1" style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              {{ pkg.durationDays }} Days, {{ pkg.durationNight }} Nights
            </div>
            <div class="d-flex align-items-center">
              <svg class="me-1" style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
              Max {{ pkg.maxTourist }}
            </div>
          </div>

          <button 
            (click)="goToExecution(pkg.packageId)"
            class="btn btn-primary w-100 fw-bold py-2 mt-auto">
            Execute Tour
          </button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="packages.length === 0" class="text-center py-5">
    <p class="text-muted fs-5">You have no assigned packages at the moment.</p>
  </div>
</div>
