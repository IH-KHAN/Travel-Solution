<div class="login-wrapper">
  <div class="login-card-container">
    <mat-card class="premium-login-card border-0">
      <div class="login-header text-center pt-5 pb-2">
        <div class="brand-logo-circle mx-auto mb-4 d-flex align-items-center justify-content-center">
          <mat-icon class="brand-icon">travel_explore</mat-icon>
        </div>
        <h2 class="fw-bold mb-1 text-dark">Admin Portal</h2>
        <p class="text-muted small px-3">Enter your professional credentials to access the management dashboard</p>
      </div>

      <mat-card-content class="px-4 pb-5 pt-2">
        <!-- Session expired alert -->
        <div *ngIf="sessionExpired" class="alert alert-warning d-flex align-items-center gap-2 mb-4 py-2 text-sm rounded-3 border-0 bg-warning-subtle" role="alert">
          <mat-icon class="alert-icon">timer_off</mat-icon>
          <span>Your session has expired. Please sign in again.</span>
        </div>

        <!-- Login error alert -->
        <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2 mb-4 py-2 text-sm rounded-3 border-0 bg-danger-subtle" role="alert">
          <mat-icon class="alert-icon text-danger">error_outline</mat-icon>
          <span class="text-danger fw-medium">{{ errorMessage }}</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100 premium-input">
              <mat-label>Email Address</mat-label>
              <mat-icon matPrefix class="text-muted me-2">mail</mat-icon>
              <input matInput formControlName="email" type="email" placeholder="admin@example.com">
              <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
              <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Enter a valid email address</mat-error>
            </mat-form-field>
          </div>

          <div class="mb-4">
            <mat-form-field appearance="outline" class="w-100 premium-input">
              <mat-label>Password</mat-label>
              <mat-icon matPrefix class="text-muted me-2">lock</mat-icon>
              <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••">
              <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button" class="text-muted" [attr.aria-label]="'Hide password'">
                <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
            </mat-form-field>
          </div>

          <button mat-flat-button color="primary" type="submit" class="w-100 premium-submit-btn fw-bold text-white mt-1" [disabled]="loginForm.invalid">
            Sign In to Dashboard
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
