<div class="list-container">
  <div class="header-actions">
    <h2>Hotel Management</h2>
    <button mat-raised-button color="primary" routerLink="/hotels/new">
      <mat-icon>add</mat-icon> Add New Hotel
    </button>
  </div>

  <mat-card class="table-card">
    <table mat-table [dataSource]="hotels" class="mat-elevation-z8">
      
      <!-- ID Column -->
      <ng-container matColumnDef="hotelId">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.hotelId}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="hotelName">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.hotelName}} </td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="accommodationType">
        <th mat-header-cell *matHeaderCellDef> Type </th>
        <td mat-cell *matCellDef="let element"> {{element.accommodationType}} </td>
      </ng-container>

      <!-- Rating Column -->
      <ng-container matColumnDef="starRating">
        <th mat-header-cell *matHeaderCellDef> Stars </th>
        <td mat-cell *matCellDef="let element"> {{element.starRating}} </td>
      </ng-container>

      <!-- Area Column -->
      <ng-container matColumnDef="cityArea">
        <th mat-header-cell *matHeaderCellDef> City Area </th>
        <td mat-cell *matCellDef="let element"> {{element.cityArea}} </td>
      </ng-container>

      <!-- Rooms Column -->
      <ng-container matColumnDef="rooms">
        <th mat-header-cell *matHeaderCellDef> Rooms (Available) </th>
        <td mat-cell *matCellDef="let element"> 
          <span class="badge" [ngClass]="element.availableRooms > 0 ? 'bg-info' : 'bg-danger'">
            {{element.availableRooms}} / {{element.totalRooms}} Vacant
          </span>
        </td>
      </ng-container>

      <!-- Active Column -->
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element">
          <span [class]="element.isActive ? 'status-active' : 'status-inactive'">
            {{element.isActive ? 'Active' : 'Inactive'}}
          </span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="accent" (click)="editHotel(element.hotelId)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteHotel(element.hotelId)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</div>
