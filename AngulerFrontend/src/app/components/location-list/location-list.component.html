<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-0">Locations</h2>
      <p class="text-muted small mb-0">Manage travel locations grouped by districts</p>
    </div>
    <button mat-raised-button color="primary" routerLink="/locations/new" id="add-location-btn">
      <mat-icon>add_location_alt</mat-icon> Add Locations
    </button>
  </div>

  <mat-card class="shadow-sm">
    <table mat-table [dataSource]="districts" class="w-100">

      <!-- ID Column -->
      <ng-container matColumnDef="districtId">
        <th mat-header-cell *matHeaderCellDef style="width:80px">ID</th>
        <td mat-cell *matCellDef="let row">{{ row.districtId }}</td>
      </ng-container>

      <!-- District Name Column -->
      <ng-container matColumnDef="districtName">
        <th mat-header-cell *matHeaderCellDef>District</th>
        <td mat-cell *matCellDef="let row">
          <span class="fw-semibold">{{ row.districtName }}</span>
        </td>
      </ng-container>

      <!-- Locations Column -->
      <ng-container matColumnDef="locations">
        <th mat-header-cell *matHeaderCellDef>Locations</th>
        <td mat-cell *matCellDef="let row">
          <div class="d-flex flex-wrap gap-1 py-2">
            <span *ngFor="let loc of row.locations" class="badge bg-primary-subtle text-primary-emphasis rounded-pill px-2 py-1">
              {{ loc.locationName }}
            </span>
            <span *ngIf="!row.locations || row.locations.length === 0" class="text-muted small">
              No locations
            </span>
          </div>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-end">Actions</th>
        <td mat-cell *matCellDef="let row" class="text-end">
          <button mat-icon-button color="primary" (click)="editDistrictLocations(row.districtId)"
                  matTooltip="Edit Locations">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteDistrictLocations(row.districtId)"
                  matTooltip="Delete All Locations in District">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="table-row-hover"></tr>
    </table>

    <div *ngIf="districts.length === 0" class="p-5 text-center text-muted">
      <mat-icon style="font-size:48px;width:48px;height:48px;opacity:0.3">location_off</mat-icon>
      <p class="mt-2">No locations found. Click "Add Locations" to get started.</p>
    </div>
  </mat-card>
</div>
